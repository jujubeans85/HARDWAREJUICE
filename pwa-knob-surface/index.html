<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HARDWAREJUICE 8-Knob Stub</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; }
    body { margin: 0; background: #0d0d0d; color: #f2f2f2; padding: 18px; }
    h1 { margin: 0 0 4px; font-size: 1.35rem; }
    p { color: #bbb; margin: 0 0 16px; }
    .top { display: grid; gap: 10px; margin-bottom: 16px; }
    input[type="text"] { width: 100%; box-sizing: border-box; padding: 12px; border-radius: 10px; border: 1px solid #444; background: #151515; color: #fff; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
    .control { background: #171717; border: 1px solid #333; border-radius: 14px; padding: 14px; }
    .label { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 8px; font-weight: 700; }
    .small { color: #aaa; font-size: 0.82rem; font-weight: 500; }
    input[type="range"] { width: 100%; }
    pre { white-space: pre-wrap; background: #111; border: 1px solid #333; border-radius: 14px; padding: 14px; color: #d9ffd9; }
    .status { font-size: 0.9rem; color: #aaa; }
  </style>
</head>
<body>
  <div class="top">
    <h1>HARDWAREJUICE — 8 Controls</h1>
    <p>iPad surface only. Mac does the audio/model work.</p>
    <label>
      WebSocket bridge URL
      <input id="wsUrl" type="text" value="ws://MAC_IP_HERE:8081" />
    </label>
    <button id="connectBtn">Connect</button>
    <div class="status" id="status">Not connected.</div>
  </div>

  <div class="grid" id="controls"></div>

  <h2>Local Prompt Preview</h2>
  <pre id="prompt">Move a control.</pre>

  <script>
    const controls = [
      { id: '01', name: 'vocal_brightness', cc: 21, osc: '/vocal/bright', value: 0.55, bins: ['dark and intimate', 'warm', 'balanced', 'bright', 'crystalline'] },
      { id: '02', name: 'vocal_body', cc: 22, osc: '/vocal/body', value: 0.45, bins: ['thin', 'lean', 'balanced', 'warm', 'full-bodied'] },
      { id: '03', name: 'timbre_blend', cc: 23, osc: '/timbre/blend', value: 0.35, bins: ['source-led', 'lightly coloured', 'hybrid', 'donor-led', 'fully transformed'] },
      { id: '04', name: 'energy', cc: 24, osc: '/global/energy', value: 0.60, bins: ['held back', 'soft push', 'moving', 'confident', 'overdriven'] },
      { id: '05', name: 'groove_swing', cc: 25, osc: '/groove/swing', value: 0.40, bins: ['straight', 'slightly loose', 'pocketed', 'lazy swing', 'falling-over swagger'] },
      { id: '06', name: 'air', cc: 26, osc: '/vocal/air', value: 0.50, bins: ['closed', 'soft top', 'open', 'breathy', 'sparkling'] },
      { id: '07', name: 'wet_dry', cc: 27, osc: '/global/wetdry', value: 0.70, bins: ['mostly direct', 'lightly treated', 'balanced', 'processed', 'fully transformed'] },
      { id: '08', name: 'prompt_weight', cc: 28, osc: '/llm/weight', value: 0.50, bins: ['ignore prompt', 'light influence', 'balanced', 'strong influence', 'prompt-dominant'] }
    ];

    let socket = null;
    const statusEl = document.getElementById('status');
    const controlsEl = document.getElementById('controls');
    const promptEl = document.getElementById('prompt');

    function binFor(control) {
      const idx = Math.min(control.bins.length - 1, Math.floor(control.value * control.bins.length));
      return control.bins[idx];
    }

    function renderPrompt() {
      promptEl.textContent = controls.map(c => `${c.name}: ${binFor(c)} (${c.value.toFixed(2)})`).join('\n');
    }

    function sendControl(control) {
      const payload = { osc: control.osc, value: Number(control.value), id: control.id, name: control.name, cc: control.cc };
      if (socket && socket.readyState === WebSocket.OPEN) {
        socket.send(JSON.stringify(payload));
      }
    }

    function renderControls() {
      controlsEl.innerHTML = '';
      controls.forEach(control => {
        const card = document.createElement('div');
        card.className = 'control';
        card.innerHTML = `
          <div class="label">
            <span>${control.id} ${control.name}</span>
            <span class="small">CC${control.cc} ${control.osc}</span>
          </div>
          <input type="range" min="0" max="1" step="0.01" value="${control.value}" />
          <div class="small value">${binFor(control)} · ${control.value.toFixed(2)}</div>
        `;
        const slider = card.querySelector('input');
        const valueEl = card.querySelector('.value');
        slider.addEventListener('input', event => {
          control.value = Number(event.target.value);
          valueEl.textContent = `${binFor(control)} · ${control.value.toFixed(2)}`;
          renderPrompt();
          sendControl(control);
        });
        controlsEl.appendChild(card);
      });
      renderPrompt();
    }

    document.getElementById('connectBtn').addEventListener('click', () => {
      const url = document.getElementById('wsUrl').value.trim();
      socket = new WebSocket(url);
      socket.addEventListener('open', () => { statusEl.textContent = `Connected to ${url}`; });
      socket.addEventListener('close', () => { statusEl.textContent = 'Disconnected.'; });
      socket.addEventListener('error', () => { statusEl.textContent = 'Connection error. Check Mac IP and bridge.'; });
    });

    renderControls();
  </script>
</body>
</html>
